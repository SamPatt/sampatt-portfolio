<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Titanic's Lifeboats</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
  /* Single deliberate look: the animation's own 1-bit grey grid, black ink and signal red. */
  :root {
    --ground: #d8d3c8; --ink: #111111; --paper: #ffffff; --signal: #e0201b; --muted: #555555;
    --mono: "VT323", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
    color-scheme: light;
  }
  html, body { height: 100%; }
  body {
    background: var(--ground); color: var(--ink); font-family: var(--mono);
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px);
    padding-top: var(--top); padding-bottom: 4px; box-sizing: border-box; overflow: hidden; margin: 0;
  }
  /* headroom above the animation: some mobile browsers draw their toolbar over the top of the page */
  :root { --top: max(16px, env(safe-area-inset-top, 0px)); }
  /* keep 9:16 exactly: as wide as the screen allows, leaving room for the credit line */
  /* the animation takes whatever height is left after the headroom and the credit line, at exactly 9:16 */
  .fit { flex: 1 1 auto; min-height: 0; width: 100%; display: flex; align-items: center; justify-content: center; container-type: size; }
  .credit { flex: none; }
  .stage { position: relative; width: min(100vw, calc((100vh - 48px - var(--top)) * 9 / 16)); width: min(100vw, calc((100svh - 48px - var(--top)) * 9 / 16)); aspect-ratio: 9 / 16; }
  @supports (container-type: size) { .stage { width: min(100cqw, calc(100cqh * 9 / 16)); } }
  @supports not (aspect-ratio: 9 / 16) { .stage { height: calc(min(100vw, calc((100vh - 48px - var(--top)) * 9 / 16)) * 16 / 9); } }
  canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; cursor: pointer; }
  .play {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    font: inherit; font-size: clamp(18px, min(4vh, 5.5vw), 34px); letter-spacing: 0.08em; text-transform: uppercase; white-space: nowrap;
    background: var(--signal); color: var(--paper); border: 3px solid var(--ink); box-shadow: 6px 6px 0 var(--ink);
    padding: 0.35em 0.9em; cursor: pointer;
  }
  .play:hover { background: var(--ink); }
  .play:focus-visible { outline: 3px solid var(--paper); outline-offset: 3px; }
  .credit { font-size: 13px; padding-inline: 8px; color: var(--muted); letter-spacing: 0.04em; text-align: center; line-height: 1.2; }
  .credit a { color: var(--ink); }
  .endlink { position: absolute; display: block; cursor: pointer; }
  .endlink[hidden], .play[hidden] { display: none; }
  .endlink:focus-visible { outline: 3px solid var(--signal); outline-offset: 2px; }
  .status { position: absolute; left: 50%; bottom: 8px; transform: translateX(-50%); font-size: 14px; color: var(--muted); }
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=VT323&display=swap">

</head>
<body>
<main class="fit">
<div class="stage">
  <canvas id="c" width="1080" height="1920" aria-label="Animation: the Titanic's lifeboats, seat by seat, and everyone aboard by class"></canvas>
  <button class="play" id="play" type="button">&#9654; Play with sound</button>
  <a class="endlink" id="endlink" href="https://sampatt.com/animations" target="_top" hidden aria-label="More animations at sampatt.com/animations"></a>
</div>
</main>
<p class="credit">Data: Wormstedt, Fitch &amp; Behe lifeboat reconstruction &middot; casualty figures via <a href="https://en.wikipedia.org/wiki/Sinking_of_the_Titanic" target="_blank" rel="noopener">Wikipedia</a> &middot; <a href="https://sampatt.com/animations" target="_top">More animations</a></p>

<script>
function bootAnim() {
// 5x7 pixel font (F) and 3x5 digits (F3) shared by the scale animations.
window.PIXEL_FONT = (function () {
  const F = {
    "A":"01110100011000111111100011000110001","B":"11110100011000111110100011000111110","C":"01110100011000010000100001000101110",
    "D":"11110100011000110001100011000111110","E":"11111100001000011110100001000011111","F":"11111100001000011110100001000010000",
    "G":"01110100011000010111100011000101111","H":"10001100011000111111100011000110001","I":"01110001000010000100001000010001110",
    "J":"00111000100001000010000101001001100","K":"10001100101010011000101001001010001","L":"10000100001000010000100001000011111",
    "M":"10001110111010110101100011000110001","N":"10001110011010110011100011000110001","O":"01110100011000110001100011000101110",
    "P":"11110100011000111110100001000010000","Q":"01110100011000110001101011001001101","R":"11110100011000111110101001001010001",
    "S":"01111100001000001110000010000111110","T":"11111001000010000100001000010000100","U":"10001100011000110001100011000101110",
    "V":"10001100011000110001100010101000100","W":"10001100011000110101101011010101010","X":"10001100010101000100010101000110001",
    "Y":"10001100010101000100001000010000100","Z":"11111000010001000100010001000011111",
    "0":"01110100011001110101110011000101110","1":"00100011000010000100001000010001110","2":"01110100010000100010001000100011111",
    "3":"11111000100010000010000011000101110","4":"00010001100101010010111110001000010","5":"11111100001111000001000011000101110",
    "6":"00110010001000011110100011000101110","7":"11111000010001000100010000100001000","8":"01110100011000101110100011000101110",
    "9":"01110100011000101111000010001001100",
    " ":"00000000000000000000000000000000000",",":"00000000000000000000001100010001000",".":"00000000000000000000000000110001100",
    ":":"00000011000110000000011000110000000","+":"00000001000010011111001000010000000","-":"00000000000000011111000000000000000",
    "/":"00001000010001000100010001000010000","'":"01100001000100000000000000000000000","(":"00010001000100001000010000010000010",
    ")":"01000001000001000010000100010001000","s":"00000000000111110000011100000111110","^":"00000011110001100101010010100000000", // ^ = north-east arrow
  };
  // 3x5 digits for rocket labels
  const F3 = {"0":"111101101101111","1":"010110010010111","2":"111001111100111","3":"111001111001111","4":"101101111001001",
    "5":"111100111001111","6":"111100111101111","7":"111001001001001","8":"111101111101111","9":"111101111001111"};

  F.s = F.s || "00000000000111110000011100000111110";
  F["&"] = F["&"] || "01100100101010001000101011001001101";
  F["%"] = F["%"] || "11001110010001000100010001001110011";
  return { F, F3 };
})();

// Titanic lifeboats animation (v2, isometric). Deterministic: render(ctx, t) draws the frame at t seconds.
(function () {
  const D = window.TITANIC, { F, F3 } = window.PIXEL_FONT;
  const W = 1080, H = 1920, S = 2;
  const INK = "#1b1a18", PAPER = "#f5f2ea", RED = "#c42a1c", GROUND = "#d8d3c8", ABOARD = "#8f8b82"; // house style: Newsprint A (historical)
  const PAL = [PAPER, INK, RED, "#99958c", "#dedad0"]; // 0 white, 1 black, 2 red, 3 grey, 4 light grey

  // ---- timing ----
  // iceberg at 11:40 and a hold; a pop-up; the clock zips the hour to the first boat (12:40); then a steady clock
  const TM = D.timing, T0 = TM.t0, ICE_HOLD = TM.ice, SEC_PER_MIN = TM.spm, SKIP = TM.skip;
  const POP_T = T0 + ICE_HOLD, ZIP0 = POP_T + TM.pop, ZIP1 = ZIP0 + TM.zip;
  const minAt = (t) => (t < ZIP0 ? 0 : t < ZIP1 ? SKIP * (t - ZIP0) / TM.zip : Math.min(D.end, SKIP + (t - ZIP1) / SEC_PER_MIN));
  const realOfMin = (m) => (m <= 0 ? T0 : m < SKIP ? ZIP0 + TM.zip * m / SKIP : ZIP1 + (m - SKIP) * SEC_PER_MIN);
  const T_SINK = realOfMin(D.end);  // 2:20 AM
  const SEA_START = T_SINK + 1.2, SEA_DUR = 2.6;
  const CHART_T = T_SINK + 4.2, END_LINK_T = T_SINK + 9.4;
  const DURATION = T_SINK + TM.tail;
  const ease = (u) => (u <= 0 ? 0 : u >= 1 ? 1 : u * u * (3 - 2 * u));
  const lerpPts = (pts, x) => { if (x <= pts[0][0]) return pts[0].slice(1); for (let i = 1; i < pts.length; i++) if (x <= pts[i][0]) { const a = pts[i - 1], b = pts[i], u = (x - a[0]) / (b[0] - a[0]); return a.slice(1).map((v, k) => v + (b[k + 1] - v) * u); } return pts[pts.length - 1].slice(1); };

  // ---- card layout (logical px) ----
  const CARD_W = 524, CX = 8, CY = 4;
  const SCENE_Y0 = 47, SCENE_Y1 = 347, WIRE_Y = 349, LEDGER_Y = 416, SLOT_W = 131, SLOT_H = 55;
  const CARD_H = LEDGER_Y + 5 * SLOT_H + 2;
  const PEOPLE_Y = CARD_H + 8, PEOPLE_H = 960 - CY - PEOPLE_Y - 8;
  const BW = CARD_W + 4, BH = PEOPLE_Y + PEOPLE_H + 4;
  const buf = new Uint8Array(BW * BH), zbuf = new Float32Array(BW * BH);
  const px = (x, y, c) => { x |= 0; y |= 0; if (x >= 0 && y >= 0 && x < BW && y < BH) buf[y * BW + x] = c; };
  const rect = (x, y, w, h, c) => { for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) px(x + i, y + j, c); };
  const frame = (x, y, w, h, c) => { rect(x, y, w, 1, c); rect(x, y + h - 1, w, 1, c); rect(x, y, 1, h, c); rect(x + w - 1, y, 1, h, c); };
  function line(x0, y0, x1, y1, c, dash) {
    x0 = Math.round(x0); y0 = Math.round(y0); x1 = Math.round(x1); y1 = Math.round(y1);
    const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
    let err = dx + dy, n = 0;
    for (;;) { if (!dash || n % dash === 0) px(x0, y0, c); n++; if (x0 === x1 && y0 === y1) break; const e2 = 2 * err; if (e2 >= dy) { err += dy; x0 += sx; } if (e2 <= dx) { err += dx; y0 += sy; } }
  }
  const textW = (s, k = 1) => s.length * 6 * k - k;
  function text(s, x, y, c, k = 1) {
    const bw = k > 1 ? k + 1 : k;
    for (const ch of s) { const g = F[ch] || F[" "]; for (let r = 0; r < 7; r++) for (let q = 0; q < 5; q++) if (g[r * 5 + q] === "1") rect(x + q * k, y + r * k, bw, k, c); x += 6 * k; }
  }
  const fmt = (n) => n.toLocaleString("en-US");
  function clockLabel(m) {
    const total = ((23 * 60 + 40 + Math.floor(m)) % 1440 + 1440) % 1440, hh = Math.floor(total / 60), mm = total % 60;
    const h12 = hh % 12 === 0 ? 12 : hh % 12;
    return [hh >= 12 ? "14 APR" : "15 APR", `${h12}:${String(mm).padStart(2, "0")} ${hh >= 12 ? "PM" : "AM"}`];
  }

  // ---- isometric scene ----
  // world metres: wx along the ship (bow at -134), wy across (starboard +, towards the viewer), z up from the waterline
  const K = 1.42, C30 = 0.866, S30 = 0.5, OX = 262, OY = 196;
  // mirrored so the side nearest the viewer is starboard: seen from starboard, the bow is on the right
  const iso = (wx, wy, z) => [OX - (wx + wy) * C30 * K, OY + (wy - wx) * S30 * K - z * K];
  function plot(wx, wy, z, c) {
    const [sx, sy] = iso(wx, wy, z), x = Math.round(sx), y = Math.round(sy);
    if (x < 1 || x >= CARD_W - 1 || y < SCENE_Y0 || y >= SCENE_Y1) return;
    const i = y * BW + x, d = -wx + wy + z;
    if (d >= zbuf[i]) { zbuf[i] = d; buf[i] = c; }
  }
  const STEP = 0.55 / K; // metres per sample, about two samples per logical pixel
  const HALF = 14, LEN = 134, DECK = 18, SUP = 27;
  function half(wx) {
    const fromBow = wx + LEN, fromStern = LEN - wx;
    if (fromBow < 0 || fromStern < 0) return -1;
    if (fromBow < 46) return HALF * Math.sqrt(fromBow / 46);
    if (fromStern < 16) return HALF * (0.35 + 0.65 * Math.sqrt(fromStern / 16));
    return HALF;
  }
  // sinking: the ship settles and tips bow-down (bow at wx=-134 goes deepest)
  // [minute, settle, bow-down, stern-up]
  let sink0 = 0, sink1 = 0, sink2 = 0;
  const SINK = [[0, 0, 0, 0], [60, 0.4, 3, 0], [100, 1, 7, 0], [130, 2, 13, 0], [145, 3, 19, 1], [152, 5, 26, 5], [157, 9, 40, 14], [159, 20, 62, 22], [160, 90, 90, 0]];
  function shipPlot(wx, wy, z, c) {
    const f = (LEN - wx) / (2 * LEN), z2 = z - sink0 - sink1 * f + sink2 * (1 - f);
    if (z2 >= 0) return plot(wx, wy, z2, z2 < 0.6 && z > 0 && c === 1 ? 0 : c); // white waterline where the hull meets the sea
    // under the surface: a faint ghost of whatever was above the waterline
    if (z > 0 && z2 > -30) {
      const [sx, sy] = iso(wx, wy, z2), x = Math.round(sx), y = Math.round(sy);
      if (x < 1 || x >= CARD_W - 1 || y < SCENE_Y0 || y >= SCENE_Y1 || (x + y) % 2) return;
      const i = y * BW + x, d = -wx + wy + z2 - 1000;
      if (d >= zbuf[i]) { zbuf[i] = d; buf[i] = 3; }
    }
  }

  const FUNNELS = [-62, -37, -12, 13], MASTS = [-108, 96];
  const DAVIT = { "1": -74, "3": -64, "5": -54, "7": -44, "2": -74, "4": -64, "6": -54, "8": -44,
    "9": 18, "11": 28, "13": 38, "15": 48, "10": 18, "12": 28, "14": 38, "16": 48, "C": -74, "D": -74, "A": -70, "B": -70 };
  for (const b of D.boats) {
    b.side = b.side === "S" ? 1 : -1;
    b.dx = DAVIT[b.id];
    b.dy = /[AB]/.test(b.id) ? b.side * 6 : /[CD]/.test(b.id) ? b.side * 9 : b.side * 12.5;
    b.launchT = realOfMin(b.t);
    b.cols = b.cap === 40 ? 10 : b.cap === 47 ? 12 : 13;
  }

  function drawShip(m) {
    [sink0, sink1, sink2] = lerpPts(SINK, m);
    // hull: black sides, white deck with a black rim
    for (let wx = -LEN; wx <= LEN; wx += STEP) {
      const h = half(wx); if (h < 0) continue;
      for (let z = -10; z <= DECK; z += STEP) { shipPlot(wx, h, z, 1); shipPlot(wx, -h, z, 1); }
      for (let wy = -h; wy <= h; wy += STEP) shipPlot(wx, wy, DECK, Math.abs(Math.abs(wy) - h) < 0.7 ? 1 : 0);
    }
    // superstructure: white block with outlined edges and a row of windows
    const X0 = -82, X1 = 58, Y = 11;
    for (let wx = X0; wx <= X1; wx += STEP) {
      for (let z = DECK; z <= SUP; z += STEP) {
        const edge = z > SUP - 0.7 || Math.abs(wx - X0) < 0.7;
        const win = Math.abs(z - 22.5) < 0.6 && ((wx - X0) % 3 < 1.2);
        shipPlot(wx, Y, z, edge || win ? 1 : 0); shipPlot(wx, -Y, z, edge ? 1 : 0);
      }
      for (let wy = -Y; wy <= Y; wy += STEP) shipPlot(wx, wy, SUP, Math.abs(Math.abs(wy) - Y) < 0.7 || Math.abs(wx - X0) < 0.7 || Math.abs(wx - X1) < 0.7 ? 1 : 0);
    }
    for (let wy = -Y; wy <= Y; wy += STEP) for (let z = DECK; z <= SUP; z += STEP) shipPlot(X0, wy, z, Math.abs(Math.abs(wy) - Y) < 0.7 || z > SUP - 0.7 ? 1 : 0);
    // funnels: white with black tops; silhouette edges inked
    const vx = -0.7071, vy = 0.7071;
    for (const fx of FUNNELS) {
      for (let a = 0; a < Math.PI * 2; a += STEP / 3.2) {
        const nx = Math.cos(a), ny = Math.sin(a), edge = Math.abs(nx * vx + ny * vy) < 0.3;
        for (let z = SUP; z <= 50; z += STEP) shipPlot(fx + nx * 3.2, ny * 3.2, z, z > 45 || edge ? 1 : 0);
      }
      for (let r = 0; r <= 3.2; r += STEP) for (let a = 0; a < Math.PI * 2; a += STEP / Math.max(r, 0.5)) shipPlot(fx + Math.cos(a) * r, Math.sin(a) * r, 50, 1);
    }
    // masts and the wireless aerial strung between them
    for (const mx of MASTS) for (let z = DECK; z <= 64; z += STEP) shipPlot(mx, 0, z, 1);
    for (let wx = MASTS[0]; wx <= MASTS[1]; wx += STEP * 3) shipPlot(wx, 0, 63.5, 1);
  }

  function boatShape(cx, cy, z0, side, fillOcc, fillEmpty, washed, plotFn) {
    // 9 m x 2.6 m boat, 1.6 m high; top face split occupied (black) / empty (red)
    const L2 = 7, W2 = 2.1, HT = 2.2; // drawn 1.5x real size so they read at phone scale
    for (let u = -L2; u <= L2; u += STEP) {
      const w = W2 * Math.sqrt(Math.max(0, 1 - (u / (L2 + 0.1)) ** 4));
      for (let z = 0; z <= HT; z += STEP) { plotFn(cx + u, cy + w, z0 + z, washed ? 3 : 1); plotFn(cx + u, cy - w, z0 + z, washed ? 3 : 1); }
      for (let v = -w; v <= w; v += STEP) {
        const rim = Math.abs(Math.abs(v) - w) < 0.5 || Math.abs(u) > L2 - 0.5;
        const frac = (u + L2) / (2 * L2), c = washed ? 3 : rim ? 1 : frac < fillOcc ? 1 : frac < fillOcc + fillEmpty ? 2 : 0;
        plotFn(cx + u, cy + v, z0 + HT, c);
      }
    }
  }

  // spots in the water, assigned in launch order nearest each boat's davit, so boats never stack
  (function assignSpots() {
    const taken = new Set(), done = { "1": 0, "-1": 0 };
    for (const b of [...D.boats].sort((a, c) => a.t - c.t)) {
      const k0 = done[b.side]++, ring = k0 < 4 ? 2 : k0 < 7 ? 1 : 0; // outer ring first, so later boats never row through earlier ones
      let best = null;
      for (let k = 0; k < 10; k++) {
        const wx = -122 + k * 27 + ring * 9, key = b.side + ":" + ring + ":" + k;
        if (taken.has(key)) continue;
        const sc = Math.abs(wx - b.dx);
        if (!best || sc < best.sc) best = { sc, key, wx, wy: b.side * (30 + ring * 16) };
      }
      taken.add(best.key); b.spotX = best.wx; b.spotY = best.wy;
      b.phase = (b.id.charCodeAt(0) * 1.7 + (b.id.charCodeAt(1) || 0)) % 6.28;
    }
  })();
  function drawBoats(t, m) {
    for (const b of D.boats) {
      const occ = b.n / b.cap, washed = b.n === 0;
      if (t < b.launchT) {
        if (t >= T_SINK) continue;
        boatShape(b.dx, b.dy, /[AB]/.test(b.id) ? SUP + 0.2 : SUP - 1, 0, 0, 0, false, shipPlot);
        continue;
      }
      const lower = ease((t - b.launchT) / 0.8);
      const away = ease(Math.max(0, (t - b.launchT - 0.8) / 2.2)); // rows out to its own spot
      const x0 = b.dx, y0 = b.dy + b.side * (HALF - Math.abs(b.dy) + 4) * lower;
      const wx = x0 + (b.spotX - x0) * away, wy = y0 + (b.spotY - y0) * away;
      const z = (SUP - 1) * (1 - lower) + (lower >= 1 ? 0.75 * Math.sin(t * 2.3 + b.phase) : 0);
      boatShape(wx, wy, z, b.side, Math.min(1, occ), Math.max(0, 1 - occ), washed, plot);
    }
  }

  function drawIceberg(t) {
    const age = t - T0, m = minAt(t); if (age < 0 || m > 30) return;
    const drift = m * 3; // slips astern as the clock runs on
    const [sx, sy] = iso(-118 + drift, 34, 0);
    const shape = ["    ##    ", "   ####   ", "  ######  ", " ######## ", "##########"];
    shape.forEach((row, j) => [...row].forEach((ch, i) => {
      if (ch !== "#") return;
      const edge = j === 0 || row[i - 1] !== "#" || row[i + 1] !== "#" || (shape[j - 1] || "")[i] !== "#";
      rect(Math.round(sx - 10 + i * 2), Math.round(sy - 10 + j * 2), 2, 2, edge ? 1 : 0);
    }));
    if (age < ICE_HOLD) { const ph = (age % 0.6) / 0.6, r = 6 + ph * 18; if (ph < 0.85) frame(Math.round(sx - r), Math.round(sy - 4 - r), Math.round(2 * r), Math.round(2 * r), 2); }
  }

  // ---- distress rockets (eight, about every six and a half minutes from 12:47; same beats as the audio) ----
  const ROCKETS = Array.from({ length: 8 }, (_, k) => realOfMin(67 + k * 6.5));
  function drawRockets(t) {
    for (const rt of ROCKETS) {
      const a = t - rt; if (a < 0 || a > 2.2 || t >= T_SINK) continue;
      const f = (LEN + 80) / (2 * LEN), base = SUP - sink0 - sink1 * f + sink2 * (1 - f);
      const [bx, by] = iso(-80, 9, base), top = 64;
      const [tx, ty] = iso(-80, 9, base + top);
      if (a < 0.7) { // the streak
        const u = a / 0.7, cy = by + (ty - by) * u;
        for (let y = Math.round(by); y > cy; y -= 2) if (y > SCENE_Y0) px(Math.round(bx), y, 1);
        rect(Math.round(bx) - 1, Math.round(cy) - 1, 3, 3, 1);
      } else { // the burst: rays, then stars drifting down
        const u = (a - 0.7) / 1.5;
        for (let k = 0; k < 12; k++) {
          const ang = k * Math.PI / 6, r = 4 + Math.min(1, u * 3) * 16;
          const sx = tx + Math.cos(ang) * r, sy = ty + Math.sin(ang) * r * 0.9 + u * u * 22;
          if (u < 0.35) line(tx + Math.cos(ang) * 3, ty + Math.sin(ang) * 3, sx, sy, 1, 2);
          else if ((k + Math.floor(u * 10)) % 3) rect(Math.round(sx), Math.round(sy), 2, 2, 1);
        }
      }
    }
  }

  // ---- wireless ----
  const WIRE = D.wireless.map(([mm, who, msg, morse]) => ({ m: mm, who, msg, morse: morse && mm >= SKIP, t: mm < 0 ? -1 : realOfMin(mm) }));

    off.getContext("2d").putImageData(img, 0, 0);

    ctx.drawImage(off, CX * S, CY * S, BW * S, BH * S);

  window.TitanicAnim = { render, DURATION, T_SINK, W, H, S, CX, CY, cardY: () => CY, buttons: () => [], endRect: () => endRect, wireless: WIRE.map((w) => ({ t: w.t, msg: w.msg, morse: w.morse })) };
})();

}

      src = actx.createBufferSource(); src.buffer = buffer; src.connect(actx.destination);
      src.start(0, Math.min(Math.max(0, now), buffer.duration - 0.01));
      srcCtxStart = actx.currentTime; srcT = now;
    } catch (e) { src = null; }
  }
  function stopAudio() { if (src) { try { src.stop(); } catch (e) {} try { src.disconnect(); } catch (e) {} src = null; } }

  function play(from) {
    if (from != null) t = from;
    if (t >= A.DURATION) t = 0;
    playing = true; btn.hidden = true;
    wallStart = performance.now(); tAtStart = t;
    startAudio(t);
  }
  function pause() { playing = false; stopAudio(); btn.hidden = false; btn.innerHTML = "&#9654; Resume"; }

  function tick(now) {
    if (playing) {
      t = tAtStart + (now - wallStart) / 1000;
      if (t >= A.DURATION) { t = A.DURATION; playing = false; stopAudio(); btn.hidden = false; btn.innerHTML = "&#8635; Watch again"; }
      // keep the sound in step; only when the audio clock is actually running
      if (src && actx && actx.state === "running" && now - lastSync > 2000) {
        lastSync = now;
        const audioPos = srcT + (actx.currentTime - srcCtxStart);
        if (Math.abs(audioPos - t) > 0.3) startAudio(t);
      }
    }
    try { A.render(ctx, t); } catch (e) { console.error(e); }
    const er = A.endRect(); // keep a real link over the end card
    if (er) {
      Object.assign(endLink.style, { left: er[0] / A.W * 100 + "%", top: er[1] / A.H * 100 + "%", width: er[2] / A.W * 100 + "%", height: er[3] / A.H * 100 + "%" });
      endLink.hidden = false;
    } else endLink.hidden = true;
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  btn.addEventListener("click", () => play());
  cv.addEventListener("click", (e) => {
    const r = cv.getBoundingClientRect();
    const x = (e.clientX - r.left) / r.width * A.W / A.S - A.CX, y = (e.clientY - r.top) / r.height * A.H / A.S - A.cardY(t);
    const b = A.buttons(), hit = (i) => b[i] && x >= b[i][0] && x < b[i][0] + b[i][2] && y >= b[i][1] && y < b[i][1] + b[i][3];
    if (hit(1)) play(0);
    else if (playing) pause();
    else play();
  });
})();
</script>
