  .scrub .fill { background: var(--ink); width: 0; height: 100%; }
  .scrub .tick { position: absolute; left: calc(var(--p) * 100%); top: 50%; width: 6px; height: 26px; transform: translate(-50%, -50%); background: var(--signal); border: 1px solid var(--ink); box-sizing: border-box; }
  .scrub .tick.end { background: var(--ink); }
  .scrub .tick.on { height: 36px; }
  .scrub .thumb { position: absolute; top: 50%; width: 30px; height: 30px; transform: translate(-50%, -50%); background: var(--signal); border: 3px solid var(--ink); box-shadow: 3px 3px 0 var(--ink); box-sizing: border-box; }

  @media (prefers-reduced-motion: reduce) { .swipe-hint, .scrub { transition: none; } }

    const img = ctx.__img || (ctx.__img = new ImageData(BW, BH));
    const rgb = PAL.map((h) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]);
    for (let i = 0; i < buf.length; i++) { const c = buf[i], o = i * 4; if (c === 255) { img.data[o + 3] = 0; continue; } const [r, g, b] = rgb[c]; img.data[o] = r; img.data[o + 1] = g; img.data[o + 2] = b; img.data[o + 3] = 255; }
    const off = ctx.__off || (ctx.__off = Object.assign(document.createElement("canvas"), { width: BW, height: BH }));
    off.getContext("2d").putImageData(img, 0, 0);
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(off, CX * S, CY * S, BW * S, BH * S);
    drawHold(ctx, clk);
    drawFinal(ctx, t);
    drawEndLink(ctx, t);
  }

  window.LibertyAnim = { render, DURATION, T_END, W, H, S, CX, CY, cardY: () => CY, buttons: () => [], endRect: () => endRect, holds: HOLDS.map((h) => ({ kind: h.kind, t: realOfDay(h.day), hold: h.hold })), realOfDay, UBOATS };
})();

}
</script>
<script>
(async function () {
  const cv = document.getElementById("c"), ctx = cv.getContext("2d"), btn = document.getElementById("play"), endLink = document.getElementById("endlink");
  window.SAT_OPTS = { labels: "center" };
  window.LIBERTY = await (await fetch("data.json")).json();
  bootAnim();
  const A = window.LibertyAnim;

  // clock: the audio context is the master clock while sound plays; rAF otherwise
  // The page clock (performance.now) drives the animation. Sound follows it and is optional:
  // some browsers block or suspend Web Audio, and the animation must play regardless.
  let t = 0, playing = false, wallStart = 0, tAtStart = 0, actx = null, buffer = null, src = null;
  let audioReady = null; // fetched on first play, so a visit that never plays costs no audio bandwidth
  let srcCtxStart = 0, srcT = 0, lastSync = 0;

  async function startAudio(at) {
    try {
      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      if (actx.state !== "running") actx.resume().catch(() => {});
      if (!audioReady) audioReady = fetch("liberty.mp3").then((r) => r.arrayBuffer()).catch(() => null);
      if (!buffer) {
        const ab = await audioReady;
        if (ab) buffer = await new Promise((ok, no) => { const p = actx.decodeAudioData(ab, ok, no); if (p && p.then) p.then(ok, no); });
      }
      if (!buffer || !playing) return;
      stopAudio();
      const now = playing ? tAtStart + (performance.now() - wallStart) / 1000 : at;
      src = actx.createBufferSource(); src.buffer = buffer; src.connect(actx.destination);
      src.start(0, Math.min(Math.max(0, now), buffer.duration - 0.01));
      srcCtxStart = actx.currentTime; srcT = now;
    } catch (e) { src = null; }
  }
  function stopAudio() { if (src) { try { src.stop(); } catch (e) {} try { src.disconnect(); } catch (e) {} src = null; } }

  function play(from) {
    if (from != null) t = from;
    if (t >= A.DURATION) t = 0;
    playing = true; btn.hidden = true;
    wallStart = performance.now(); tAtStart = t;
    startAudio(t);
  }
  function pause() { playing = false; stopAudio(); btn.hidden = false; btn.innerHTML = "&#9654; Resume"; }

  function tick() {
    // one clock: performance.now(), never the rAF timestamp, which can run on a different base inside nested frames
    const now = performance.now();
    if (playing) {
      t = Math.max(0, tAtStart + (now - wallStart) / 1000);
      if (t >= A.DURATION) { t = A.DURATION; playing = false; stopAudio(); btn.hidden = false; btn.innerHTML = "&#8635; Watch again"; }
      // keep the sound in step; only when the audio clock is actually running
      if (src && actx && actx.state === "running" && now - lastSync > 2000) {
        lastSync = now;
        const audioPos = srcT + (actx.currentTime - srcCtxStart);
        if (Math.abs(audioPos - t) > 0.3) startAudio(t);
      }
    }
    try { A.render(ctx, t); } catch (e) { console.error(e); }
    const er = A.endRect(); // keep a real link over the end card
    if (er) {
      Object.assign(endLink.style, { left: er[0] / A.W * 100 + "%", top: er[1] / A.H * 100 + "%", width: er[2] / A.W * 100 + "%", height: er[3] / A.H * 100 + "%" });
      endLink.hidden = false;
    } else endLink.hidden = true;
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  /* BEGIN scrub */
  window.__player = {   // for the scrubber
    anim: A, get t() { return t; }, get playing() { return playing; },
    seek(v) { t = Math.max(0, Math.min(A.DURATION, v)); if (playing) { tAtStart = t; wallStart = performance.now(); startAudio(t); } btn.hidden = true; },
    hold() { if (playing) { playing = false; stopAudio(); } btn.hidden = true; },
    resume() { play(); },
  };
  (function () {
// Swipe scrubbing for the interactive players (Sam's pick, 2026-11-27). Drag sideways across the animation to move
// through time; the frame stays while the finger stays; drag near a card and it snaps onto it; let go and it carries
// on (or stays paused). The bar is invisible except while swiping. A small hint shows once, the first time it plays.
// Taps still play and pause; vertical swipes still scroll the page. Arrow keys step 2 s, Page keys jump card to card.
// Needs window.__player = { anim, t, playing, seek(t), hold(), resume() } from the player page. Cards come from
// ScaleAnim.cards ({t, hold, head}), or from the older animations' holds/events lists.
(function () {
  const P = window.__player, A = P.anim, D = A.DURATION;
  const src = A.cards || A.holds || A.events || [];
  const cards = src.filter((c) => c && typeof c.t === "number" && c.t >= 0 && c.t <= D)
    .map((c) => ({ t: c.t, hold: c.hold || 3, head: c.head || "", final: !!c.final }))
    .map((c) => ({ ...c, at: c.t + Math.min(1.0, c.hold * 0.3) })); // land just after the card has faded in
  const stage = document.querySelector(".stage"), cv = document.getElementById("c"), clamp = (v) => Math.max(0, Math.min(1, v));
  const fmtT = (s) => Math.floor(s / 60) + ":" + String(Math.floor(s % 60)).padStart(2, "0");
  const label = (c) => (c.head ? c.head.replace(/,.*$/, "").slice(0, 18) : fmtT(c.at));

  const root = document.createElement("div"); root.className = "scrub";
  root.innerHTML = `
    <div class="track" role="slider" tabindex="0" aria-label="Move through the animation" aria-valuemin="0" aria-valuemax="${Math.round(D)}">
      <div class="groove"><div class="fill"></div></div>
      ${cards.map((c) => `<i class="tick${c.final ? " end" : ""}" style="--p:${c.at / D}"></i>`).join("")}
      <div class="thumb"><span class="bubble"></span></div>
    </div>`;
  stage.appendChild(root);
  const track = root.querySelector(".track"), thumb = root.querySelector(".thumb"), fill = root.querySelector(".fill"), bubble = root.querySelector(".bubble");

  // a position → a time, pulled onto a card when close (within ~14 px of bar), with a little buzz on phones
  let snapped = null;
  function timeAt(p, lenPx) {
    let t = clamp(p) * D, best = null;
    for (const c of cards) { const dpx = Math.abs(c.at - t) / D * lenPx; if (dpx < 14 && (!best || dpx < best.d)) best = { c, d: dpx }; }
    if (best) { if (snapped !== best.c && navigator.vibrate) try { navigator.vibrate(8); } catch (e) {} snapped = best.c; return best.c.at; }
    snapped = null; return t;
  }
  let dragging = false, wasPlaying = false;
  function begin() { dragging = true; wasPlaying = P.playing; P.hold(); root.classList.add("dragging"); hideHint(); }
  function end() { if (!dragging) return; dragging = false; root.classList.remove("dragging"); snapped = null; if (wasPlaying) P.resume(); }

  // the swipe: sideways only (vertical stays a page scroll); a full-width swipe covers 60% of the animation
  let sx = 0, st = 0, armed = false, swiping = false, swallow = false;
  cv.style.touchAction = "pan-y";
  cv.addEventListener("pointerdown", (e) => { sx = e.clientX; st = P.t; armed = true; swiping = false; });
  cv.addEventListener("pointermove", (e) => {
    if (!armed) return; const dx = e.clientX - sx, w = cv.getBoundingClientRect().width;
    if (!swiping && Math.abs(dx) > 10) { swiping = true; try { cv.setPointerCapture(e.pointerId); } catch (err) {} begin(); }
    if (swiping) P.seek(timeAt(clamp(st / D + dx / w * 0.6), w * 0.92 / 0.6));
  });
  const up = () => { armed = false; if (swiping) { swiping = false; swallow = true; end(); setTimeout(() => (swallow = false), 0); } };
  cv.addEventListener("pointerup", up); cv.addEventListener("pointercancel", up);
  cv.addEventListener("click", (e) => { if (swallow) { e.stopImmediatePropagation(); e.preventDefault(); } }, true); // a swipe is not a tap

  // keyboard, on the (focusable, otherwise invisible) bar
  track.addEventListener("keydown", (e) => {
    const k = e.key; let t = P.t;
    if (k === "ArrowRight" || k === "ArrowUp") t += 2; else if (k === "ArrowLeft" || k === "ArrowDown") t -= 2;
    else if (k === "PageDown") t = (cards.find((c) => c.at > P.t + 0.1) || { at: D }).at;
    else if (k === "PageUp") t = ([...cards].reverse().find((c) => c.at < P.t - 0.1) || { at: 0 }).at;
    else if (k === " " || k === "Enter") { e.preventDefault(); return P.playing ? P.hold() : P.resume(); } else return;
    e.preventDefault(); P.seek(Math.max(0, Math.min(D, t)));
  });

  // the hint: once, the first time it plays; it leaves after a few seconds or at the first swipe
  const hint = document.createElement("div"); hint.className = "swipe-hint"; hint.setAttribute("aria-hidden", "true");
  hint.innerHTML = "<b>&#9664;</b> SWIPE TO MOVE THROUGH TIME <b>&#9654;</b>"; stage.appendChild(hint);
  let hinted = false, hideT = 0;
  function hideHint() { clearTimeout(hideT); hint.classList.remove("show"); }
  (function watch() { if (P.playing && !hinted) { hinted = true; hint.classList.add("show"); hideT = setTimeout(hideHint, 3500); return; } if (!hinted) requestAnimationFrame(watch); })();

  // keep the bar in step with the player; touch the page only when something changed
  let lastP = -1, lastTxt = "", lastCur;
  const ticks = [...root.querySelectorAll(".tick")];
  function frame() {
    const p = P.t / D;
    if (p !== lastP) { lastP = p; thumb.style.left = p * 100 + "%"; fill.style.width = p * 100 + "%"; track.setAttribute("aria-valuenow", Math.round(P.t)); }
    const cur = [...cards].reverse().find((c) => P.t >= c.t && P.t < c.t + c.hold);
    const txt = cur ? label(cur) : fmtT(P.t); if (txt !== lastTxt) { lastTxt = txt; bubble.textContent = txt; }
    if (cur !== lastCur) { lastCur = cur; ticks.forEach((el, i) => el.classList.toggle("on", cards[i] === cur)); }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();

  })();
  /* END scrub */
  btn.addEventListener("click", () => play());
  cv.addEventListener("click", (e) => {
    const r = cv.getBoundingClientRect();
    const x = (e.clientX - r.left) / r.width * A.W / A.S - A.CX, y = (e.clientY - r.top) / r.height * A.H / A.S - A.cardY(t);
    const b = A.buttons(), hit = (i) => b[i] && x >= b[i][0] && x < b[i][0] + b[i][2] && y >= b[i][1] && y < b[i][1] + b[i][3];
    if (hit(1)) play(0);
    else if (playing) pause();
    else play();
  });
})();
</script>
