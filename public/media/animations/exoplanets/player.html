<title>Every Planet Found Beyond the Sun</title>

<style>
  /* Single deliberate look: the animation's own 1-bit grey grid, black ink and signal red. */
  :root {
    --ground: #dcdcdc; --ink: #111111; --paper: #ffffff; --signal: #e0201b; --muted: #555555;
    --mono: "VT323", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
    color-scheme: light;

  html { height: 100%; } body { min-height: 100%; }
  body {
    background: var(--ground); color: var(--ink); font-family: var(--mono);
    display: flex; flex-direction: column; align-items: center; gap: 6px; overflow-x: hidden;
    padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px);
    padding-top: var(--top); padding-bottom: 8px; box-sizing: border-box; margin: 0;
  }
  /* headroom above the animation: some mobile browsers draw their toolbar over the top of the page */
  :root { --top: max(6px, env(safe-area-inset-top, 0px)); }
  /* Phones (portrait): the animation is as wide as the screen allows and the credit follows below it, a short scroll
     away if needed. Wider screens keep the credit in view under the animation. Auto margins centre the pair when there
     is room and collapse to zero when there isn't. */
  .fit { margin-top: auto; width: 100%; display: flex; justify-content: center; }
  .credit { flex: none; margin-bottom: auto; }
  .stage { position: relative; aspect-ratio: 9 / 16;
    width: min(100vw, calc((100vh - var(--top) - 10px) * 9 / 16)); width: min(100vw, calc((100svh - var(--top) - 10px) * 9 / 16)); }
  @media (min-aspect-ratio: 3/4) {
    .stage { width: min(100vw, calc((100vh - var(--top) - 60px) * 9 / 16)); width: min(100vw, calc((100svh - var(--top) - 60px) * 9 / 16)); }
  }
  @supports not (aspect-ratio: 9 / 16) { .stage { height: calc(min(100vw, calc((100vh - var(--top) - 10px) * 9 / 16)) * 16 / 9); } }
  canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; cursor: pointer; }
  .play {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    font: inherit; font-size: clamp(18px, min(4vh, 5.5vw), 34px); letter-spacing: 0.08em; text-transform: uppercase; white-space: nowrap;
    background: var(--signal); color: var(--paper); border: 3px solid var(--ink); box-shadow: 6px 6px 0 var(--ink);
    padding: 0.35em 0.9em; cursor: pointer;
  }
  .play:hover { background: var(--ink); }
  .play:focus-visible { outline: 3px solid var(--paper); outline-offset: 3px; }
  .credit { font-size: 13px; padding-inline: 8px; color: var(--muted); letter-spacing: 0.04em; text-align: center; line-height: 1.2; }
  .credit a { color: var(--ink); }
  .endlink { position: absolute; display: block; cursor: pointer; }
  .endlink[hidden], .play[hidden] { display: none; }
  .endlink:focus-visible { outline: 3px solid var(--signal); outline-offset: 2px; }
  .status { position: absolute; left: 50%; bottom: 8px; transform: translateX(-50%); font-size: 14px; color: var(--muted); }
  /* BEGIN scrub */
  /* swipe scrubber: invisible until you swipe across the animation (shared/scrub.js) */
  .scrub { position: absolute; left: 4%; right: 4%; bottom: 1.5%; opacity: 0; transition: opacity 0.25s; pointer-events: none; font-family: var(--mono); color: var(--ink); -webkit-user-select: none; user-select: none; }
  .scrub.dragging, .scrub:focus-within { opacity: 1; transition: opacity 0.08s; }
  .scrub .track { position: relative; height: 46px; }
  .scrub .track:focus-visible { outline: 3px solid var(--signal); outline-offset: 2px; }
  .scrub .groove { position: absolute; left: 0; right: 0; top: 50%; height: 12px; transform: translateY(-50%); background: rgba(255,255,255,0.85); border: 2px solid var(--ink); box-sizing: border-box; overflow: hidden; }
  .scrub .fill { background: var(--ink); width: 0; height: 100%; }
  .scrub .tick { position: absolute; left: calc(var(--p) * 100%); top: 50%; width: 6px; height: 26px; transform: translate(-50%, -50%); background: var(--signal); border: 1px solid var(--ink); box-sizing: border-box; }
  .scrub .tick.end { background: var(--ink); }
  .scrub .tick.on { height: 36px; }
  .scrub .thumb { position: absolute; top: 50%; width: 30px; height: 30px; transform: translate(-50%, -50%); background: var(--signal); border: 3px solid var(--ink); box-shadow: 3px 3px 0 var(--ink); box-sizing: border-box; }
  .scrub .bubble { position: absolute; bottom: calc(100% + 10px); left: 50%; transform: translateX(-50%); white-space: nowrap; background: var(--ink); color: var(--paper); padding: 0 7px; font-size: 20px; line-height: 1.3; }
  .swipe-hint { position: absolute; left: 50%; bottom: 3%; transform: translate(-50%, 8px); font-family: var(--mono); font-size: clamp(18px, 5.4vw, 26px); letter-spacing: 0.06em;
    white-space: nowrap; background: var(--ink); color: var(--paper); border: 3px solid var(--ink); box-shadow: 4px 4px 0 var(--signal); padding: 2px 12px; opacity: 0; pointer-events: none; transition: opacity 0.35s, transform 0.35s; }
  .swipe-hint b { color: var(--signal); font-weight: 400; }
  .swipe-hint.show { opacity: 1; transform: translate(-50%, 0); }
  @media (prefers-reduced-motion: reduce) { .swipe-hint, .scrub { transition: none; } }
  /* END scrub */

// Shared scale-animation engine. Deterministic: render(ctx, t) draws the frame at t seconds.

// the map (pre-projected to logical pixels), the events (one per real item), the clock, the cards.
// House style: STYLE.md. Historical subjects use Newsprint A, modern ones Field.
(function () {
  const A = window.ANIM, { F } = window.PIXEL_FONT;

  const THEMES = {
    historical: { ink: "#1b1a18", paper: "#f5f2ea", red: "#c42a1c", ground: "#d8d3c8", grey: "#99958c", light: "#dedad0", dark: "#5a5751" }, // Newsprint A
    modern: { ink: "#111111", paper: "#ffffff", red: "#e0201b", ground: "#dcdcdc", grey: "#9a9a9a", light: "#d0d0d0", dark: "#555555" },   // Field

  };

  const INK = TH.ink, PAPER = TH.paper, RED = TH.red, ONRED = "#ffffff";
  // palette indices: 0 paper, 1 ink, 2 red, 3 grey, 4 light, 6 dark grey (the third kind)

  for (const [i, c] of Object.entries(A.pal || {})) PAL[+i] = c;   // extra colours an animation needs (flags, rivers...), indices 8+

  const ease = (u) => (u <= 0 ? 0 : u >= 1 ? 1 : u * u * (3 - 2 * u));
  const fmt = (n) => Math.round(n).toLocaleString("en-US");
  const K = A.kinds, NK = K.length, EV = A.ev, N = EV.t.length;

  // ---- clock: data time (days since 1970) → seconds, from the knots, with holds for the cards ----
  const KN = A.knots, HOLDS = (A.holds || []).slice().sort((a, b) => a.t - b.t);
  function baseT(d) {
    if (d <= KN[0][0]) return KN[0][1];
    for (let i = 1; i < KN.length; i++) if (d <= KN[i][0]) { const [a, sa] = KN[i - 1], [b, sb] = KN[i]; return sa + (sb - sa) * (d - a) / (b - a); }
    return KN[KN.length - 1][1];
  }
  function baseInv(s) {
    if (s <= KN[0][1]) return KN[0][0];
    for (let i = 1; i < KN.length; i++) if (s <= KN[i][1]) { const [a, sa] = KN[i - 1], [b, sb] = KN[i]; return a + (b - a) * (s - sa) / (sb - sa); }
    return KN[KN.length - 1][0];
  }
  // A card can play out its own event while it is up: `span: [a, b]` runs data time from a to b during the card
  // (after a short beat to read it), and `ramp: [from, to]` counts the items in that window up from nothing, so a single
  // huge item (a quake's energy, a storm's deaths) visibly pours into the counters, chart and squares.
  for (const h of HOLDS) if (h.span) h.t = h.span[0];

    let acc = 0;

  const evReal = new Float64Array(N); for (let i = 0; i < N; i++) evReal[i] = realOf(EV.t[i]); // seconds on screen, for flashes

  const hasW = !!EV.w;
  const cnt = [], wsum = [];
  for (let k = 0; k < NK; k++) { cnt.push(new Float64Array(N + 1)); if (hasW) wsum.push(new Float64Array(N + 1)); }
  for (let i = 0; i < N; i++) for (let k = 0; k < NK; k++) {
    const me = EV.k[i] === k; cnt[k][i + 1] = cnt[k][i] + (me ? 1 : 0); if (hasW) wsum[k][i + 1] = wsum[k][i] + (me ? EV.w[i] : 0);
  }
  const upTo = (d) => { let lo = 0, hi = N; while (lo < hi) { const m = (lo + hi) >> 1; if (EV.t[m] <= d) lo = m + 1; else hi = m; } return lo; }; // events with t <= d

  const sumAt = (n, kinds, w) => kinds.reduce((s, k) => s + (w ? wsum[k][n] : cnt[k][n]), 0);

  // Below the map card: an optional feed panel (a running list, e.g. names), then the squares.
  // Squares either take whatever room is left (pitch shrinks to fit), or, with a fixed pitch and `bottom` or chartH "fill",
  // sit at the bottom at their own size, and the chart (or the feed) takes the rest.
  const BW = CARD_W + 4, BH = 956 - CY;
  const SQ = A.squares || null, FEED = A.feed || null;

  const sqNeed = (p) => SQ.groups.reduce((a, g) => a + 19 + Math.ceil(g.total / sqCols(p)) * p, 0);
  if (SQ) SQ.groups.forEach((g) => { g.total = Math.round(counterVal({ kinds: g.kinds, w: g.w }, N) / g.per); });

  const MAP_Y0 = 47, MAP_H = A.mapH || 0, CHART_Y0 = MAP_Y0 + MAP_H + (MAP_H ? 2 : 0);
  const CHART_H = !A.chart ? 0 : A.chartH === "fill" ? BH - 6 - SQ_BOX - 8 - (FEED ? FEED.h + 8 : 0) - 2 - CHART_Y0 : (A.chartH || 158);

  let LW = 1; // line width for tracks: 1 or 2 px
  function line(x0, y0, x1, y1, c, clip) {
    x0 = Math.round(x0); y0 = Math.round(y0); x1 = Math.round(x1); y1 = Math.round(y1);
    const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1; let err = dx + dy;

  }

  function dateLabel(d) {
    const dt = new Date(Math.min(d, A.t1 - 1e-6) * 86400000), Y = dt.getUTCFullYear(), M = MONTHS[dt.getUTCMonth()], D = dt.getUTCDate();

  }

  // ---- static layer: cards, map base, labels ----
  const titleBar = (y0, t) => { const tw = textW(t); for (let y = y0 + 2; y < y0 + 10; y += 2) rect(1, y, CARD_W - 2, 1, 1); rect((CARD_W - tw) / 2 - 4, y0 + 1, tw + 8, 10, 0); text(t, (CARD_W - tw) / 2, y0 + 2, 1); };

    buf.fill(255);
    rect(3, 3, CARD_W, CARD_H, SH); rect(0, 0, CARD_W, CARD_H, 0); frame(0, 0, CARD_W, CARD_H, 1);
    titleBar(0, A.title);
    rect(1, 11, CARD_W - 2, 1, 1); rect(1, MAP_Y0 - 1, CARD_W - 2, 1, 1); if (MAP_H) rect(1, CHART_Y0 - 1, CARD_W - 2, 1, 1);

      for (const [x, y, n, c] of A.runs || []) rect(x, y, n, 1, c);  // a pre-drawn picture behind the data (e.g. a mountain), as runs
      if (A.grid) for (const g of A.grid) poly(g, A.gridCol || 4, inMap); // sky grid or graticule, light
      for (const [c, P] of A.lines || []) poly(P, c, inMap);          // extra figures (e.g. constellations), each in its own colour
      for (const P of A.borders || []) poly(P, 4, inMap);            // borders, state lines, lakes: light
      for (const P of A.rivers || []) poly(P, A.riverCol || 4, inMap);
      for (const P of A.coast || []) poly(P, 3, inMap);              // coastlines: grey
      if (A.cells) drawCellAxes();
    }
    const panel = (y0, h, title) => { rect(3, y0 + 3, CARD_W, h, SH); rect(0, y0, CARD_W, h, 0); frame(0, y0, CARD_W, h, 1); titleBar(y0, title); rect(1, y0 + 11, CARD_W - 2, 1, 1); };

    if (FEED) panel(FEED_Y, FEED_H, FEED.title);
  }

  let outline = null;
  function makeOutline() {
    const save = buf.slice(); buf.fill(255);

    for (const P of A.coast || []) poly(P, A.outlineTop.coast, inMap);
    const ix = []; for (let i = 0; i < buf.length; i++) if (buf[i] !== 255) ix.push(i, buf[i]);
    outline = Int32Array.from(ix); buf.set(save);
  }
  let staticCopy = null;

  // ---- map: committed layer (old items, drawn once) + live items (recent, flashing, moving) ----

<script>
(async function () {
  const cv = document.getElementById("c"), ctx = cv.getContext("2d"), btn = document.getElementById("play"), endLink = document.getElementById("endlink");
  window.SAT_OPTS = { labels: "center" };

      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      if (actx.state !== "running") actx.resume().catch(() => {});
      if (!audioReady) audioReady = fetch("exoplanets.mp3").then((r) => r.arrayBuffer()).catch(() => null);
      if (!buffer) {
        const ab = await audioReady;
        if (ab) buffer = await new Promise((ok, no) => { const p = actx.decodeAudioData(ab, ok, no); if (p && p.then) p.then(ok, no); });

    if (t >= A.DURATION) t = 0;
    playing = true; btn.hidden = true;
    wallStart = performance.now(); tAtStart = t;
    startAudio(t);
  }

  })();
